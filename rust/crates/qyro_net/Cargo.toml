[package]
name = "qyro_net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Qyro network transport: QYRO/1 frames over a blocking TCP socket."

[lib]
path = "src/lib.rs"

# Zero new external dependencies, which is the whole point of ADR-0028 §6: the
# transport is `std::net` and `std::thread`, and the framing it carries already
# exists. `qyro_protocol` is first-party and already in the audited graph, so
# this crate adds one package to Cargo.lock and that package is itself.
[dependencies]
# A new edge into the audited graph, not a new package: qyro_crypto is already
# there. The handshake and the AEAD are its business, and this crate only moves
# their bytes.
qyro_crypto = { path = "../qyro_crypto" }
qyro_protocol = { path = "../qyro_protocol" }

# ADR-0035 §7 and amendment 1. Windows only: on Android and iOS the discovery
# is not Rust's and cannot be, because the local-network gate sits below the
# socket API. Pure Rust, no async runtime -- its own thread and channels, which
# fits the synchronous engine -- Apache-2.0 OR MIT.
[target.'cfg(windows)'.dependencies]
mdns-sd = "0.20.3"