[package]
name = "qyro_eye"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "El ojo: píxeles de luma entran, un archivo sale. No sabe qué es una cámara."

[lib]
path = "src/lib.rs"

# **Cero crates nuevos en el lock** (ADR-0048 §2). Los dos ya estaban: `rqrr`
# como dev-dependency del CLI desde la fase 15, y el fountain es de casa.
#
# `rqrr` pasa aquí a dependencia **normal** porque el ojo de Android necesita el
# decodificador dentro del producto, y eso hace real un aviso que antes no lo
# era: ver `.cargo/audit.toml`, que lo dice con su condición de caducidad.
[dependencies]
qyro_fountain = { path = "../qyro_fountain" }
# **`default-features = false`, y no es cosmetica.** La feature `img` de `rqrr`
# arrastra el crate `image` entero -- con `moxcms` y `pxfm` de gestion de color--,
# unos quince paquetes, a una biblioteca que **Dart carga en el telefono**. Este
# ojo lee un plano de luma que ya viene de la camara: no decodifica PNG ni JPEG
# ni los va a decodificar.
#
# Lo canto el changelog de dependencias de `qyro_ffi` al ver aparecer `image`
# bajo la frontera C, que es exactamente para lo que ese changelog existe.
rqrr = { version = "0.10.1", default-features = false }

# Sólo para la prueba de vuelta completa: dibuja lo que dibuja `qyro beam` para
# poder rasterizarlo y dárselo al ojo. En el producto, quien dibuja es el CLI y
# quien mira es esto; que la prueba haga las dos cosas es lo que permite
# ejercitar la cadena entera **sin cámara** (ADR-0048 §5).
[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
