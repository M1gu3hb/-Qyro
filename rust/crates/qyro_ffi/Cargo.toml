[package]
name = "qyro_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

# ADR-0032 §2. EXACTLY these two, and the depth-one guard in
# tests/c_abi_contract.rs is what keeps it exact. Rust puts only *direct*
# dependencies in a crate's extern prelude, so this list is the complete set of
# crates whose items this one can name -- which is what bounds the reachable
# crypto surface to qyro_session's public API.
[dependencies]
qyro_core = { path = "../qyro_core" }
qyro_session = { path = "../qyro_session" }

[dev-dependencies]
# Reads `cargo metadata` in the C ABI contract test, so the FFI dependency
# closure is asked of Cargo's resolver instead of scraped out of the manifest
# text. MIT/Apache-2.0, dev-only: it is not linked into the library Dart loads,
# and it was already in this workspace's lock file as a dev-dependency of
# qyro_crypto, so no crate is added to the audited graph.
serde_json = "1.0.145"
# Dibuja el QR que la prueba del símbolo 35 le da a leer al ojo. Dev-only, y ya
# estaba en el lock como dev-dependency de `qyro_eye`: una arista, no un paquete.
qrcode = { version = "0.14", default-features = false }
