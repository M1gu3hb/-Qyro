[package]
name = "qyro_crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Qyro device identity: Ed25519 keys, domain-separated signatures and fingerprints."

[lib]
path = "src/lib.rs"

# No features. The deterministic seed constructor used to sit behind a
# `test-vectors` feature, but features are additive: any crate in a dependency
# graph could switch it on for every other crate, and no release build could
# prove it was off. It is now `cfg(test)` and crate-private, so it does not
# exist outside the test build at all.

[dependencies]
# Ed25519 (RFC 8032) from dalek-cryptography. BSD-3-Clause. See ADR-0020 and
# docs/LICENSE_AUDIT.md for the full evaluation.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["rand_core", "zeroize"] }
# SHA-256 for the fingerprint. RustCrypto, MIT/Apache-2.0.
sha2 = { version = "0.11.0", default-features = false }
# Wipes secret material on drop. MIT/Apache-2.0.
zeroize = { version = "1.9.0", default-features = false, features = ["zeroize_derive"] }
# System CSPRNG. MIT/Apache-2.0. Production entropy comes from here and nowhere
# else; there is deliberately no weaker fallback.
getrandom = "0.4.3"

[dev-dependencies]
# The committed vector files are parsed as JSON rather than scraped with string
# searches. MIT/Apache-2.0, dev-only: it is not linked into the library.
serde_json = "1.0.145"
