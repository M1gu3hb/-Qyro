[package]
name = "qyro_crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Qyro device identity: Ed25519 keys, domain-separated signatures and fingerprints."

[lib]
path = "src/lib.rs"

[features]
default = []
# Deterministic identities from a fixed seed, for test vectors only. Never in
# `default`, so it cannot be switched on by accident in a release build.
test-vectors = []

[dependencies]
# Ed25519 (RFC 8032) from dalek-cryptography. BSD-3-Clause. See ADR-0020 and
# docs/LICENSE_AUDIT.md for the full evaluation.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["rand_core", "zeroize"] }
# SHA-256 for the fingerprint. RustCrypto, MIT/Apache-2.0.
sha2 = { version = "0.11.0", default-features = false }
# Wipes secret material on drop. MIT/Apache-2.0.
zeroize = { version = "1.9.0", default-features = false, features = ["zeroize_derive"] }
# System CSPRNG. MIT/Apache-2.0. Production entropy comes from here and nowhere
# else; there is deliberately no weaker fallback.
getrandom = "0.4.3"

# Both targets exercise the fixed-seed constructor, so they require the
# `test-vectors` feature. CI runs `cargo test --workspace --all-features`, which
# turns it on; a default build cannot reach the constructor at all.
[[test]]
name = "identity_vectors"
path = "tests/identity_vectors.rs"
required-features = ["test-vectors"]

[[example]]
name = "emit_vectors"
path = "examples/emit_vectors.rs"
required-features = ["test-vectors"]
