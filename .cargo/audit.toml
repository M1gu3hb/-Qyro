# Excepciones de `cargo audit`. **Una, y con su condición de caducidad escrita.**
#
# **La regla bajo la que vive este archivo:** un ignore sin argumento es una
# alarma silenciada, y una alarma silenciada es peor que ninguna alarma porque se
# lee como «limpio». Toda entrada dice qué es, por qué no llega al producto, y
# **qué tiene que pasar para borrarla**.
#
# ## Lo que pasó el 2026-08-19, y no fue lo previsto
#
# Había dos entradas contra `lru` 0.12.5 vía `rqrr` 0.9.3, y su condición de
# borrado decía: *«cuando `rqrr` publique una versión que tome `lru` 0.13 o
# posterior, o cuando algo haga `rqrr` dependencia normal»*.
#
# La fase 24 hace las dos cosas: `rqrr` sube a 0.10.1 —que trae `lru` 0.16.4— y
# pasa a dependencia normal, porque el ojo de Android necesita el decodificador
# **dentro** del producto.
#
# **Y al medirlo, la condición se cumplió sólo a medias:**
#
# - **RUSTSEC-2026-0002** (`IterMut` violando Stacked Borrows) — **arreglada** en
#   `lru` 0.16.4. Entrada borrada.
# - **RUSTSEC-2026-0253** (use-after-free si `pop()` entra en pánico) — **sigue
#   viva**. `cargo audit --json` da `patched: >=0.18.2`, y `rqrr` 0.10.1 fija
#   `lru ^0.16`, así que `cargo update -p lru --precise 0.18.2` **falla**: no hay
#   forma de llegar al parche sin cambiar de decodificador.
#
# Se anota tal cual en vez de borrar las dos: **borrar la segunda porque se
# esperaba que caducara sería exactamente la alarma silenciada que este archivo
# prohíbe.**

[advisories]
ignore = [
    # RUSTSEC-2026-0253, `lru` 0.16.4 <- rqrr 0.10.1 <- qyro_eye (normal).
    #
    # **Es unsoundness, no una vulnerabilidad explotable conocida**, y lo que la
    # dispara es que `pop()` entre en pánico — lo cual requiere que el `Hash` o
    # el `Eq` de la clave entren en pánico. Las claves de esa caché son internas
    # de `rqrr` y **no las controla lo que entre por la cámara**: unos píxeles
    # hostiles no llegan a ese camino.
    #
    # No es gratis y no se presenta como gratis: es la primera vez que este
    # proyecto acepta un aviso en código que **sí** viaja en el producto.
    #
    # **Bórrala cuando `rqrr` publique una versión que tome `lru` >= 0.18.2.**
    # Es una sola línea de `Cargo.toml` y una corrida de `cargo audit` para
    # comprobarlo.
    "RUSTSEC-2026-0253",
]
