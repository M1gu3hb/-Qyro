# `cargo audit` exceptions. Two, both argued, both with the condition that ends
# them written down.
#
# **The rule this file lives under:** an ignore with no argument is a silenced
# alarm, and a silenced alarm is worse than no alarm because it reads as "clean".
# Every entry below says what it is, why it does not reach the product, and what
# has to happen for it to be deleted.

[advisories]
ignore = [
    # RUSTSEC-2026-0002 and RUSTSEC-2026-0253, both against `lru` 0.12.5:
    # `IterMut` violating Stacked Borrows, and a use-after-free if `pop()`
    # panics. Both are **unsoundness**, not known-exploitable vulnerabilities.
    #
    # Path, verified with `cargo tree -i lru -e normal,dev` on 2026-08-18:
    #
    #     lru 0.12.5 <- rqrr 0.9.3 <- qyro_cli [dev-dependencies]
    #
    # `rqrr` is the QR decoder that reads back what `qyro beam` draws
    # (ADR-0044 §6 keeps the decoder out of the shipped binary on purpose), so
    # **this code is not in any artefact Qyro distributes** -- it runs in
    # `cargo test` and nowhere else. Measured: adding it moved the release
    # binary by zero bytes.
    #
    # `cargo update -p lru` does not move it: `rqrr` 0.9.3 pins `lru 0.12`, and
    # the fix is in a later minor.
    #
    # **Delete these two lines when either happens:**
    #   * `rqrr` releases a version that takes `lru` 0.13 or later, or
    #   * anything makes `rqrr` a normal dependency rather than a dev one --
    #     at which point this argument is void and the advisory is real.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]
