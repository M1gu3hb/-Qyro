[workspace]
resolver = "2"
members = [
  "rust/crates/qyro_core",
  "rust/crates/qyro_crypto",
  "rust/crates/qyro_ffi",
  "rust/crates/qyro_fs",
  "rust/crates/qyro_identity_store",
  "rust/crates/qyro_manifest",
  "rust/crates/qyro_net",
  "rust/crates/qyro_protocol",
  "rust/crates/qyro_transfer",
  # Windows only. The one crate in the product that relaxes forbid(unsafe_code);
  # see ADR-0024 §1.
  "rust/crates/qyro_win_dpapi",
  # Test harness, never shipped. See docs/adr/ADR-0023-crypto-platform-test-harness.md.
  "rust/tools/qyro_crypto_smoke",
  # Two-process persistence harness. Never shipped; see ADR-0023.
  "rust/tools/qyro_store_smoke",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.0.1"
