name: iOS runtime ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/**"
      - "rust/crates/qyro_ffi/**"
      - "Cargo.*"
  push:
    branches: [audit/baseline-hardening]
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/**"
      - "rust/crates/qyro_ffi/**"
      - "Cargo.*"

permissions:
  contents: read

concurrency:
  group: ios-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-runtime:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: apps/qyro
        run: flutter pub get --enforce-lockfile
      - name: Execute native ABI smoke test in an iOS simulator
        working-directory: apps/qyro
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          qyro_simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$qyro_simulator_id"
          xcrun simctl boot "$qyro_simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$qyro_simulator_id" -b
          flutter test integration_test/native_abi_smoke_test.dart -d "$qyro_simulator_id"
