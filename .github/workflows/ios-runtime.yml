name: iOS runtime ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/ios/**"
      - "apps/qyro/pubspec.*"
      - "rust/crates/qyro_ffi/**"
      - "Cargo.*"
  push:
    branches: [audit/baseline-hardening]
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/ios/**"
      - "apps/qyro/pubspec.*"
      - "rust/crates/qyro_ffi/**"
      - "Cargo.*"

permissions:
  contents: read

concurrency:
  group: ios-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-runtime:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: apps/qyro
        run: flutter pub get --enforce-lockfile
      - name: Boot an available iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          qyro_simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$qyro_simulator_id"
          echo "id=$qyro_simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$qyro_simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$qyro_simulator_id" -b
      - name: Execute qyro_ffi XCTest through the Runner host
        working-directory: apps/qyro
        run: >-
          xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination id=${{ steps.simulator.outputs.id }}
          CODE_SIGNING_ALLOWED=NO
