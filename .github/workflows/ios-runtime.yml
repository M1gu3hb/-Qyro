name: iOS runtime ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/ios/**"
      - "apps/qyro/pubspec.*"
      - "rust/crates/qyro_ffi/**"
      # `qyro_ffi` depends on `qyro_core`, so a change there changes the
      # library this workflow loads. It was not listed, which meant the ABI
      # check would not run for the one crate that can actually alter what
      # Dart links (QYR-0045).
      - "rust/crates/qyro_core/**"
      - "Cargo.*"
  push:
    # Any working branch, by pattern. Naming one is what QYR-0040 was:
    # sprint 4C.2 wrote the then-current branch into six files, which made "CI
    # runs on the working branch" true of that branch and false of the next one.
    # A pattern is a property of the repository; a name is a reminder, and the
    # reminder was not enough.
    #
    # `claude/**` and not `**`: covering every branch in the repository spends
    # runner minutes on work this project did not start.
    #
    # Push rather than a pull request, deliberately. A `pull_request` run
    # executes against a merge commit that exists only inside the Actions run,
    # so its run ID cannot be cited as evidence for a commit in this branch. A
    # push run executes on exactly the commit that was pushed, which is the
    # thing STATUS.md has to name.
    branches: [main, 'claude/**']
    paths:
      - ".github/workflows/ios-runtime.yml"
      - "apps/qyro/ios/**"
      - "apps/qyro/pubspec.*"
      - "rust/crates/qyro_ffi/**"
      # `qyro_ffi` depends on `qyro_core`, so a change there changes the
      # library this workflow loads. It was not listed, which meant the ABI
      # check would not run for the one crate that can actually alter what
      # Dart links (QYR-0045).
      - "rust/crates/qyro_core/**"
      - "Cargo.*"

permissions:
  contents: read

concurrency:
  group: ios-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-runtime:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build and stage qyro_ffi static libraries
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          cargo build --locked --package qyro_ffi --target aarch64-apple-ios
          cargo build --locked --package qyro_ffi --target aarch64-apple-ios-sim
          mkdir -p apps/qyro/ios/Native/iphoneos apps/qyro/ios/Native/iphonesimulator
          cp target/aarch64-apple-ios/debug/libqyro_ffi.a \
            apps/qyro/ios/Native/iphoneos/libqyro_ffi.a
          cp target/aarch64-apple-ios-sim/debug/libqyro_ffi.a \
            apps/qyro/ios/Native/iphonesimulator/libqyro_ffi.a
          for qyro_platform in iphoneos iphonesimulator; do
            qyro_library="apps/qyro/ios/Native/$qyro_platform/libqyro_ffi.a"
            qyro_symbols="$RUNNER_TEMP/qyro-$qyro_platform.symbols"
            nm -gU "$qyro_library" > "$qyro_symbols"
            grep -q ' _qyro_protocol_version_ptr$' "$qyro_symbols"
            grep -q ' _qyro_protocol_version_len$' "$qyro_symbols"
          done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: apps/qyro
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS application with qyro_ffi
        working-directory: apps/qyro
        run: flutter build ios --debug --no-codesign
      - name: Verify native symbols in the unsigned application
        working-directory: apps/qyro
        shell: bash
        run: |
          set -euo pipefail
          qyro_app=build/ios/iphoneos/Runner.app
          qyro_symbols="$RUNNER_TEMP/qyro-runner.symbols"
          : > "$qyro_symbols"
          for qyro_binary in "$qyro_app/Runner" "$qyro_app/Runner.debug.dylib"; do
            if [[ -f "$qyro_binary" ]]; then
              nm -gU "$qyro_binary" >> "$qyro_symbols"
            fi
          done
          grep -q ' _qyro_protocol_version_ptr$' "$qyro_symbols"
          grep -q ' _qyro_protocol_version_len$' "$qyro_symbols"
      - name: Boot an available iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          qyro_simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$qyro_simulator_id"
          echo "id=$qyro_simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$qyro_simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$qyro_simulator_id" -b
      - name: Execute qyro_ffi XCTest through the Runner host
        working-directory: apps/qyro
        run: >-
          xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination id=${{ steps.simulator.outputs.id }}
          CODE_SIGNING_ALLOWED=NO
