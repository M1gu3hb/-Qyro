name: Crypto platform

# Real evidence that qyro_crypto works on the platforms Qyro ships to.
#
# The other four workflows build and run qyro_ffi, which deliberately cannot
# reach qyro_crypto, so none of them says anything about the handshake, the key
# schedule, the AEAD or the replay window away from x86_64 Linux. Building
# qyro_ffi for a target is not building qyro_crypto for it — see
# scripts/check_crypto_platform_evidence.sh, which refuses that substitution.
#
# Kept separate from the ABI workflows on purpose: mixing the two would let a
# green run mean either thing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/crates/qyro_crypto/**"
      - "rust/crates/qyro_protocol/**"
      - "rust/tools/qyro_crypto_smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/crypto-platform.yml"
  push:
    # `main` is where this belongs once merged. The working branch is listed
    # because a `workflow_dispatch` workflow that has never existed on the
    # default branch cannot be dispatched at all — GitHub answers 404 — and a
    # new workflow has to prove itself somewhere before it is merged. Remove the
    # second entry when this reaches main; `android-runtime.yml` still carries a
    # branch that stopped existing three sprints ago, which is what happens when
    # nobody writes that down.
    branches: [main, claude/qyro-crypto-platform-hardening]
    paths:
      - "rust/crates/qyro_crypto/**"
      - "rust/crates/qyro_protocol/**"
      - "rust/tools/qyro_crypto_smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/crypto-platform.yml"

permissions:
  contents: read

concurrency:
  group: crypto-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test qyro_crypto natively
        run: cargo test --locked --package qyro_crypto
      - name: Execute the crypto smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cargo run --locked --package qyro_crypto_smoke -- --json | tee reports/linux.json
          cargo run --locked --package qyro_crypto_smoke
      - name: Record the toolchain and checksum the report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            rustc --version
            cargo --version
          } > reports/linux-toolchain.txt
          sha256sum reports/linux.json > reports/linux.json.sha256
          cat reports/linux.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-crypto-smoke-linux
          path: reports/
          if-no-files-found: error
          retention-days: 14

  windows-crypto:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test qyro_crypto natively
        run: cargo test --locked --package qyro_crypto
      - name: Execute the crypto smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cargo run --locked --package qyro_crypto_smoke -- --json | tee reports/windows.json
          cargo run --locked --package qyro_crypto_smoke
      - name: Record the toolchain and checksum the report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "commit=$env:GITHUB_SHA"     | Out-File -FilePath reports/windows-toolchain.txt -Encoding utf8
          "runner=$env:RUNNER_OS-$env:RUNNER_ARCH" | Out-File -FilePath reports/windows-toolchain.txt -Append -Encoding utf8
          (rustc --version)            | Out-File -FilePath reports/windows-toolchain.txt -Append -Encoding utf8
          (cargo --version)            | Out-File -FilePath reports/windows-toolchain.txt -Append -Encoding utf8
          $digest = (Get-FileHash -Algorithm SHA256 reports/windows.json).Hash.ToLower()
          "$digest  windows.json" | Out-File -FilePath reports/windows.json.sha256 -Encoding utf8
          Write-Host $digest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-crypto-smoke-windows
          path: reports/
          if-no-files-found: error
          retention-days: 14

  android-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Enable KVM access for the hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cross-compile qyro_crypto for both Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-linux-android aarch64-linux-android
          qyro_ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          test -n "$qyro_ndk"
          qyro_toolchain="$qyro_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$qyro_toolchain/x86_64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$qyro_toolchain/aarch64-linux-android21-clang"
          # The library itself, for both ABIs an APK would carry. arm64 is a
          # compile-only claim: this runner is x86_64 and cannot execute it.
          cargo build --locked --package qyro_crypto --target x86_64-linux-android
          cargo build --locked --package qyro_crypto --target aarch64-linux-android
          # And the harness, as an executable adb can push.
          cargo build --locked --package qyro_crypto_smoke --bin qyro_crypto_smoke \
            --target x86_64-linux-android
          cargo build --locked --package qyro_crypto_smoke --bin qyro_crypto_smoke \
            --target aarch64-linux-android
          file target/x86_64-linux-android/debug/qyro_crypto_smoke
          file target/aarch64-linux-android/debug/qyro_crypto_smoke
      - name: Execute the crypto smoke inside an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics -camera-back none
          script: bash .github/scripts/android_crypto_smoke.sh
      - name: Checksum the report
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/android.json
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "executed=x86_64-linux-android (emulator, api 35)"
            echo "compiled-only=aarch64-linux-android"
            rustc --version
          } > reports/android-toolchain.txt
          sha256sum reports/android.json > reports/android.json.sha256
          cat reports/android.json reports/android.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-crypto-smoke-android
          path: reports/
          if-no-files-found: error
          retention-days: 14

  ios-crypto:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Cross-compile qyro_crypto for device and simulator
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          # Device is a compile-only claim: there is no hardware in CI.
          cargo build --locked --package qyro_crypto --target aarch64-apple-ios
          cargo build --locked --package qyro_crypto --target aarch64-apple-ios-sim
          cargo build --locked --package qyro_crypto_smoke --lib --target aarch64-apple-ios
          cargo build --locked --package qyro_crypto_smoke --lib --target aarch64-apple-ios-sim
          for qyro_triple in aarch64-apple-ios aarch64-apple-ios-sim; do
            qyro_library="target/$qyro_triple/debug/libqyro_crypto_smoke.a"
            test -f "$qyro_library"
            nm -gU "$qyro_library" | grep -q ' _qyro_crypto_smoke_run$'
          done
      - name: Package the simulator library as an XCFramework
        shell: bash
        run: |
          set -euo pipefail
          qyro_package=rust/tools/qyro_crypto_smoke
          rm -rf "$qyro_package/ios/CQyroCryptoSmoke.xcframework"
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios-sim/debug/libqyro_crypto_smoke.a \
            -headers "$qyro_package/include" \
            -output "$qyro_package/ios/CQyroCryptoSmoke.xcframework"
      - name: Boot an available iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          qyro_simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$qyro_simulator_id"
          echo "id=$qyro_simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$qyro_simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$qyro_simulator_id" -b
      - name: Execute the crypto smoke through XCTest on the simulator
        working-directory: rust/tools/qyro_crypto_smoke/ios
        run: >-
          xcodebuild test
          -scheme QyroCryptoSmoke-Package
          -destination id=${{ steps.simulator.outputs.id }}
          CODE_SIGNING_ALLOWED=NO
      - name: Record what ran and what only compiled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/ios.json <<REPORT
          {"target":"aarch64-apple-ios-sim","outcome":"success","code":0,
           "mechanism":"xcodebuild test on a booted simulator",
           "compiled_only":"aarch64-apple-ios",
           "commit":"${GITHUB_SHA}"}
          REPORT
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "executed=aarch64-apple-ios-sim (simulator)"
            echo "compiled-only=aarch64-apple-ios (no hardware in CI)"
            rustc --version
            xcodebuild -version | tr '\n' ' '
            echo
          } > reports/ios-toolchain.txt
          shasum -a 256 reports/ios.json > reports/ios.json.sha256
          cat reports/ios.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-crypto-smoke-ios
          path: reports/
          if-no-files-found: error
          retention-days: 14
