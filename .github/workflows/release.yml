name: Release

# The v1.0 artifacts, and the only place they can be built.
#
# `flutter build` needs symlink support for the plugin registrant, and the
# development machine has Developer Mode off (QYR-0324) -- it is a system
# setting belonging to the owner of that machine, not to this project. So the
# APK and the Windows bundle are built here, on runners that have it, and their
# SHA-256 is what `docs/release/v1.0.md` publishes.
#
# **The APK this workflow produces is signed with the debug key.** The release
# signing material is `key.properties`, which is not in the repository and never
# will be, and this project does not put a private signing key into a repository
# secret. Signing is a separate, local, deliberate step; see
# `docs/release/v1.0.md` for the exact commands and for both hashes.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release with the two artifacts"
        type: boolean
        default: false
      tag:
        description: "Tag for that Release. Never v1.0.0: the retraction stays."
        type: string
        default: "v1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build qyro_ffi for Android, release
        shell: bash
        run: |
          set -euo pipefail
          # **Tres ABIs, y armeabi-v7a es la que faltaba.** Con solo arm64-v8a y
          # x86_64, un telefono de 32 bits -- que sigue siendo mucho aparato
          # barato y mucho aparato de hace cinco anos -- instala el APK y muere
          # con UnsatisfiedLinkError al primer uso del motor, porque no hay
          # lib/armeabi-v7a/ que cargar. x86_64 se queda: es el emulador, y sin
          # el no hay forma de probar nada sin un telefono delante.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          qyro_ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          test -n "$qyro_ndk"
          bin="$qyro_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # **La alineacion de 16 KB, pedida y no supuesta.** El NDK r28 la pone
          # por omision y el r27 y anteriores no, y un runner de GitHub cambia de
          # NDK sin avisar a nadie. Un .so alineado a 0x1000 NO CARGA en Android
          # 15: dlopen falla y la aplicacion muere al primer uso del motor, con
          # la aplicacion ya instalada. Pedirlo explicitamente cuesta una linea
          # y es idempotente donde ya estaba puesto.
          # inspect_apk.py lo mide despues sobre el APK, que es donde importa.
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android21-clang"
          # `armv7a-...-androideabi21`, con la `a` y con `eabi`: el nombre del
          # enlazador de 32 bits no se deriva del triple de Rust.
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$bin/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android21-clang"
          cargo build --locked --release --package qyro_ffi --target aarch64-linux-android
          cargo build --locked --release --package qyro_ffi --target armv7-linux-androideabi
          cargo build --locked --release --package qyro_ffi --target x86_64-linux-android
          mkdir -p apps/qyro/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          cp target/aarch64-linux-android/release/libqyro_ffi.so apps/qyro/android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libqyro_ffi.so apps/qyro/android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libqyro_ffi.so apps/qyro/android/app/src/main/jniLibs/x86_64/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
        working-directory: apps/qyro
      - run: flutter build apk --release
        working-directory: apps/qyro
      # The same assertion the debug job makes, on the artifact people install.
      # A permission a plugin adds appears in the merged manifest and nowhere
      # else, and this is the build that ships.
      #
      # QYR-0368 turned this step around: it now also asserts that INTERNET is
      # **present**. Until then this file only ever forbade permissions, so the
      # one permission the product cannot run without disappeared from `main`
      # and every check stayed green -- `app/src/debug/` and `app/src/profile/`
      # carry it, and neither reaches a release build.
      - name: The merged release manifest declares INTERNET and no storage
        working-directory: apps/qyro
        run: flutter test test/android_manifest_test.dart
        env:
          QYRO_REQUIRE_MERGED_MANIFEST: "1"
          # And it must be the **release** manifest that was read. The debug one
          # carries INTERNET from app/src/debug/, so reading it here would pass
          # while the APK being published stayed broken.
          QYRO_REQUIRE_RELEASE_MANIFEST: "1"
      - name: The APK carries qyro_ffi and not the crypto smoke harness
        shell: bash
        working-directory: apps/qyro
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libqyro_ffi.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libqyro_ffi.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libqyro_ffi.so'
          if unzip -l "$apk" | grep -qi 'qyro_crypto_smoke'; then
            echo "[FAIL] the APK contains the crypto smoke harness" >&2
            exit 1
          fi
      # **Comprobacion 20, y ahora automatica.** Android 15 corre con paginas de
      # 16 KB y un `.so` cuyos PT_LOAD estan alineados a 0x1000 **no carga**:
      # dlopen falla y la aplicacion muere al primer uso del motor. Se mide
      # sobre el `.so` EXTRAIDO DEL APK y no sobre el que salio de cargo, porque
      # entre el enlazador y el paquete hay un empaquetador que puede no
      # conservar lo que el enlazador dejo. Hasta hoy se media a mano, una vez,
      # y quedaba escrita en un mensaje de commit.
      - name: Las tres ABIs, y los 16 KB medidos donde carga
        working-directory: apps/qyro
        run: |
          python3 ../../tools/apk_inspector/inspect_apk.py \
            build/app/outputs/flutter-apk/app-release.apk \
            --require-abi arm64-v8a \
            --require-abi armeabi-v7a \
            --require-abi x86_64
      - name: Record what this APK is, and what it is not
        shell: bash
        working-directory: apps/qyro
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          apk=build/app/outputs/flutter-apk/app-release.apk
          cp "$apk" "$GITHUB_WORKSPACE/artifacts/app-release-debugkey.apk"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum app-release-debugkey.apk > SHA256SUMS.txt
          {
            echo "Qyro v1.0 Android APK."
            echo
            echo "SIGNED WITH THE DEBUG KEY. This is not the release-signed"
            echo "artifact: key.properties is not in the repository and this"
            echo "project does not put a private signing key into a CI secret."
            echo "The release-signed APK and its own SHA-256 are in"
            echo "docs/release/v1.0.md."
            echo
            echo "NOTHING HERE HAS EVER RUN ON A PHONE. See"
            echo "docs/testing/hardware-protocol.md -- twenty scenarios, twenty"
            echo "blank results."
            echo
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "rustc=$(rustc --version)"
          } > BUILD-INFO.txt
          cat SHA256SUMS.txt BUILD-INFO.txt
          {
            echo "### Android"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-android-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  windows:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build qyro_ffi for Windows, release
        run: cargo build --locked --release --package qyro_ffi
      # **Y el binario de terminal, que es el que la guia usa de verdad.**
      # `docs/GUIA-DE-PRUEBA.md` conduce por `qyro.exe` -- un solo archivo, se
      # copia y funciona -- y hasta hoy ese archivo solo existia como artefacto
      # de corrida de `cli-builds.yml`, que caduca y que hay que estar
      # registrado en GitHub para bajar. Una guia que manda a una Release donde
      # su archivo principal no esta es peor que no mandar a ninguna.
      #
      # Con el triple explicito y no por omision: es la ruta que la guia nombra,
      # y `.cargo/config.toml` cuelga de ese nombre el `+crt-static` sin el cual
      # el .exe pide vcruntime140.dll en la maquina de al lado.
      - name: Build the terminal binary, release
        run: cargo build --locked --release --package qyro_cli --target x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/qyro
      - run: flutter build windows --release
        working-directory: apps/qyro
      - name: Package, verify and hash the portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'apps\qyro\build\windows\x64\runner\Release'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target\release\qyro_ffi.dll') `
                    -Destination (Join-Path $bundle 'qyro_ffi.dll')
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\verify_windows_package.ps1') -BundlePath $bundle

          # Checksums of every file, inside the package. A checksum a person
          # cannot see after downloading verifies the transfer and nothing else.
          #
          # Enumerated and hashed **completely** before the output file is
          # opened. `Get-ChildItem | ForEach-Object | Out-File` streams, so
          # `Out-File` creates SHA256SUMS.txt inside the very directory being
          # walked and `Get-ChildItem` then reaches it while it is still held:
          # "The process cannot access the file ... because it is being used by
          # another process". `platform-builds.yml` never hit this because it
          # writes its copy outside the bundle first.
          $sums = Join-Path $bundle 'SHA256SUMS.txt'
          $files = @(Get-ChildItem -LiteralPath $bundle -Recurse -File)
          $lines = @($files | ForEach-Object {
              $relative = $_.FullName.Substring($bundle.Length + 1)
              "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $relative"
          })
          $lines | Out-File -FilePath $sums -Encoding utf8

          @(
              'Qyro v1.0 Windows x64 portable.'
              ''
              'Release configuration, unsigned: MSIX and Authenticode want a'
              'code-signing certificate, which costs money (ADR-0010 amended).'
              'Windows SmartScreen will warn, and it is right to.'
              ''
              'NOTHING HERE HAS EVER RUN ON TWO REAL MACHINES ON A REAL'
              'NETWORK. See docs/testing/hardware-protocol.md.'
              ''
              "commit=$env:GITHUB_SHA"
              "ref=$env:GITHUB_REF"
              "workflow_run=$env:GITHUB_RUN_ID"
              "rustc=$(rustc --version)"
          ) | Out-File -FilePath (Join-Path $bundle 'BUILD-INFO.txt') -Encoding utf8

          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null
          $zip = Join-Path $artifacts 'qyro-windows-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip -Force

          # El binario de terminal va suelto, sin comprimir: es UN archivo, y
          # pedirle a alguien que descomprima un ZIP de un solo `.exe` para
          # copiarlo a un pendrive es trabajo inventado.
          $cli = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release\qyro.exe'
          Copy-Item -LiteralPath $cli -Destination (Join-Path $artifacts 'qyro.exe')

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $cliHash = (Get-FileHash -Algorithm SHA256 (Join-Path $artifacts 'qyro.exe')).Hash.ToLower()
          @(
              "$hash  qyro-windows-x64.zip"
              "$cliHash  qyro.exe"
          ) | Out-File -FilePath (Join-Path $artifacts 'SHA256SUMS.txt') -Encoding utf8
          Write-Host "qyro-windows-x64.zip  $hash"
          Write-Host "qyro.exe  $cliHash"
          # One string per line rather than embedded escapes: `\n` in a
          # PowerShell double-quoted string is a literal backslash-n, not a
          # newline, and a summary full of `\n` is a summary nobody can copy a
          # hash out of.
          @(
              '### Windows'
              ''
              '```'
              "$hash  qyro-windows-x64.zip"
              '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-windows-x64-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # La publicacion, y por que vive aqui y no en la maquina de nadie.
  #
  # Crear una Release y subirle archivos necesita un token con `contents:
  # write`. El de este trabajo -- `GITHUB_TOKEN`, automatico -- lo tiene y
  # **no es un secreto del propietario**: caduca al terminar la corrida. Asi
  # que la Release la hace la maquina que construyo los binarios, y los
  # SHA-256 que publica son los que ella misma acaba de medir sobre los
  # archivos descargados, no los que otro paso escribio en un `.txt`.
  #
  # LA v1.0.0 NO SE TOCA. Su retractacion sigue publicada, con su titulo y sus
  # tres archivos, porque quien descargo aquello merece encontrarla. Esta
  # etiqueta es otra, y sus notas dicen a cual sustituye.
  #
  # Nota sobre el bucle: una etiqueta creada con `GITHUB_TOKEN` no dispara
  # workflows (proteccion de GitHub), asi que el `push: tags: v*` de arriba no
  # se re-arma solo.
  publish:
    if: inputs.publish
    needs: [android, windows]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta no puede ser la retractada
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.tag }}" = "v1.0.0" ]; then
            echo "[FAIL] v1.0.0 es la publicacion RETRACTADA y se queda como esta." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: qyro-android-release
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: qyro-windows-x64-release
          path: dist/windows
      - name: Medir los dos artefactos aqui, y montar las notas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          apk=dist/android/app-release-debugkey.apk
          zip=dist/windows/qyro-windows-x64.zip
          cli=dist/windows/qyro.exe
          test -f "$apk"
          test -f "$zip"
          test -f "$cli"
          cp "$apk" "$zip" "$cli" dist/upload/
          cd dist/upload
          # Medidos aqui, sobre los archivos que se van a subir. Un hash que
          # viene de un .txt de otro trabajo verifica ese .txt, no el archivo.
          sha256sum app-release-debugkey.apk qyro-windows-x64.zip qyro.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          {
            cat docs/release/NOTAS-v1.0.1.md
            echo
            echo "## Los SHA-256, medidos por la maquina que los construyo"
            echo
            echo '```'
            cat dist/upload/SHA256SUMS.txt
            echo '```'
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- corrida: <https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>"
          } > dist/NOTAS.md
      - name: Crear o actualizar la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          title="Qyro $tag - los tres artefactos, y lo que no se ha probado"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file dist/NOTAS.md --prerelease
            gh release upload "$tag" \
              dist/upload/app-release-debugkey.apk \
              dist/upload/qyro-windows-x64.zip \
              dist/upload/qyro.exe \
              dist/upload/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file dist/NOTAS.md \
              --prerelease \
              dist/upload/app-release-debugkey.apk \
              dist/upload/qyro-windows-x64.zip \
              dist/upload/qyro.exe \
              dist/upload/SHA256SUMS.txt
          fi
          # Y la retractada sigue ahi: se comprueba, no se supone.
          gh release view v1.0.0 --json tagName,isPrerelease,name \
            | tee /dev/stderr \
            | grep -q 'RETRACTADO'
