name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Any working branch, by pattern. Naming one is what QYR-0040 was:
    # sprint 4C.2 wrote the then-current branch into six files, which made "CI
    # runs on the working branch" true of that branch and false of the next one.
    # A pattern is a property of the repository; a name is a reminder, and the
    # reminder was not enough.
    #
    # `claude/**` and not `**`: covering every branch in the repository spends
    # runner minutes on work this project did not start.
    #
    # Push rather than a pull request, deliberately. A `pull_request` run
    # executes against a merge commit that exists only inside the Actions run,
    # so its run ID cannot be cited as evidence for a commit in this branch. A
    # push run executes on exactly the commit that was pushed, which is the
    # thing STATUS.md has to name.
    branches: [main, 'claude/**']

# No `paths:` filter, deliberately. This job is the one that has to run on every
# push whatever changed — it is what says the workspace still builds, still
# passes, and still agrees with its own documentation. A filter here is a filter
# on "is the repository sound" (QYR-0045).

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Covers the wire contracts, the manifest contracts, the property tests
      # and the fuzz corpus smoke tests.
      # Covers the identity vectors and the RFC 8032 known-answer test too: both
      # moved inside qyro_crypto when the fixed-seed constructor became
      # `cfg(test)` and crate-private, so they no longer need a feature flag and
      # can no longer be skipped by running the default set.
      - run: cargo test --workspace
      # qyro_fs has one opt-in feature for the privileged Windows reparse-point
      # fixture. This line covers its Unix build; the matrix job below executes
      # the Windows side on a runner that can create the link.
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # Mandatory from sprint 2 on. Sprint 4A added the Ed25519 stack, so this
      # now guards real third-party code on a security-critical path; every
      # crate and licence is recorded in docs/LICENSE_AUDIT.md.
      - name: Audit dependencies for security advisories
        run: cargo audit --deny warnings
      # rust/fuzz is a separate workspace (libfuzzer-sys needs nightly), so it is
      # not covered by cargo fmt --all above.
      - name: Check fuzz target formatting
        run: rustfmt --check --edition 2024 rust/fuzz/fuzz_targets/*.rs

  rust-windows:
    name: rust workspace (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      # The workspace has Windows-only production and eight cfg(windows) DPAPI
      # tests; its ninth guard test runs everywhere. Linux cannot cover that
      # production surface, which is how QYR-0105 survived until 5C.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fs-final-component:
    name: fs final-component guard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            feature_args: ''
          - os: macos-latest
            feature_args: ''
          - os: windows-latest
            feature_args: '--features windows-reparse-test'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refuse a final-component link without touching its target
        run: >-
          cargo test -p qyro_fs ${{ matrix.feature_args }}
          tests::a_symlink_at_the_final_part_component_is_refused_without_touching_its_target
          -- --exact
      - name: Reject an opened part outside the destination root
        run: >-
          cargo test -p qyro_fs ${{ matrix.feature_args }}
          tests::an_opened_part_outside_the_root_is_rejected_before_it_can_be_changed
          -- --exact

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qyro
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build qyro_ffi for the Dart integration test
        working-directory: .
        run: cargo build --package qyro_ffi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify generated branding
        working-directory: .
        run: dart tools/branding_generator/bin/generate.dart --check
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- .
            exit 1
          fi
      - run: flutter analyze
      - name: Run Flutter and native ABI tests
        run: flutter test
        env:
          QYRO_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libqyro_ffi.so

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Verify Bash and PowerShell script contracts
        shell: bash
        run: |
          status=0
          bash scripts/tests/doctor_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/doctor_contract_test.ps1 || status=1
          bash scripts/tests/bootstrap_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/bootstrap_contract_test.ps1 || status=1
          bash scripts/tests/test_all_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/test_all_contract_test.ps1 || status=1
          bash scripts/tests/docs_consistency_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/docs_consistency_contract_test.ps1 || status=1
          pwsh -NoProfile -File scripts/tests/windows_package_contract_test.ps1 || status=1
          bash scripts/tests/launch_surface_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/launch_surface_contract_test.ps1 || status=1
          bash scripts/tests/repo_portability_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/repo_portability_contract_test.ps1 || status=1
          bash scripts/tests/crypto_platform_evidence_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/crypto_platform_evidence_contract_test.ps1 || status=1
          python3 -m unittest tools/logo_ascii_generator/test_logo_ascii_generator.py || status=1
          exit "$status"

  documentation:
    runs-on: ubuntu-latest
    steps:
      # Full history: the checker proves STATUS.md's verified commit is reachable
      # from HEAD, which a shallow clone cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check_docs_consistency.sh
      - run: pwsh -NoProfile -File scripts/check_docs_consistency.ps1
      # A Linux runner happily creates paths Windows cannot check out, so this
      # has to be asserted rather than discovered when a Windows job dies at
      # `actions/checkout`. See scripts/check_repo_portability.sh.
      - run: bash scripts/check_repo_portability.sh
      - run: pwsh -NoProfile -File scripts/check_repo_portability.ps1
      # Building qyro_ffi for a target is not building qyro_crypto for it. This
      # refuses that substitution, which is what let four green workflows mean
      # less than they looked like they meant.
      - run: bash scripts/check_crypto_platform_evidence.sh
      - run: pwsh -NoProfile -File scripts/check_crypto_platform_evidence.ps1
      # The source half of keeping the test harness out of the product. The
      # artifact half lives in platform-builds.yml, where the APK, the
      # Runner.app and the Windows ZIP exist.
      - run: bash scripts/check_harness_isolation.sh
      - run: pwsh -NoProfile -File scripts/check_harness_isolation.ps1

  mutation-fs-linux-phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install the pinned mutation runner
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Sweep every qyro_fs mutant on Linux
        continue-on-error: true
        run: >-
          cargo mutants --no-config -p qyro_fs -j 4 --baseline skip --timeout 90
          -o mutation-results/fs-linux
      - name: Print the complete mutation classification
        if: always()
        shell: bash
        run: |
          for result in caught missed timeout unviable; do
            file="mutation-results/fs-linux/mutants.out/${result}.txt"
            if [[ -f "$file" ]]; then
              echo "[$result]"
              cat "$file"
            fi
          done
      - name: Upload the machine-readable mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-qyro-fs-linux-mutation
          path: mutation-results/fs-linux/mutants.out
