name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # **Con `paths` desde 2026-08-18 (QYR-0367).** No tenía ninguno, así que un
    # commit de sólo documentación compilaba el árbol entero en dos sistemas
    # operativos. Lo que este flujo comprueba es código; el trabajo de
    # documentación se fue a `documentation.yml` con su propio disparador, para
    # que separarlos no apagara la comprobación que un cambio de documentación
    # sí necesita.
    #
    # Any working branch, by pattern. Naming one is what QYR-0040 was:
    # sprint 4C.2 wrote the then-current branch into six files, which made "CI
    # runs on the working branch" true of that branch and false of the next one.
    # A pattern is a property of the repository; a name is a reminder, and the
    # reminder was not enough.
    #
    # `claude/**` and not `**`: covering every branch in the repository spends
    # runner minutes on work this project did not start.
    #
    # Push rather than a pull request, deliberately. A `pull_request` run
    # executes against a merge commit that exists only inside the Actions run,
    # so its run ID cannot be cited as evidence for a commit in this branch. A
    # push run executes on exactly the commit that was pushed, which is the
    # thing STATUS.md has to name.
    branches: [main]
    paths:
      - "rust/**"
      - "apps/qyro/**"
      - "tools/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"

# **Este comentario decía «No `paths:` filter, deliberately» justo debajo del
# bloque `paths:` que lo desmiente**, y estuvo así desde que QYR-0367 partió este
# flujo. Un comentario que contradice a las diez líneas de encima es peor que
# ninguno: quien lo lea creerá que el filtro no existe y no entenderá por qué su
# commit no disparó nada.
#
# Lo que decía era cierto cuando se escribió, y la mitad que sigue siendo cierta
# es ésta: **la solidez del repositorio no debe quedar detrás de un filtro.** Por
# eso el trabajo `documentation` se fue a `documentation.yml` con sus propias
# rutas — corre cuando cambia la documentación, que es cuando hace falta— y lo
# que queda aquí compila y prueba código, así que se filtra por lo que se
# compila (QYR-0045, QYR-0367).

permissions:
  contents: read

jobs:
  rust:
    # QYR-0078: seven consecutive runs hung for hours because no job
    # declared a cap, so a stuck step ran to GitHub's six-hour default
    # instead of failing with a log somebody could read.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Covers the wire contracts, the manifest contracts, the property tests
      # and the fuzz corpus smoke tests.
      # Covers the identity vectors and the RFC 8032 known-answer test too: both
      # moved inside qyro_crypto when the fixed-seed constructor became
      # `cfg(test)` and crate-private, so they no longer need a feature flag and
      # can no longer be skipped by running the default set.
      - run: cargo test --workspace
      # D6 de deuda-de-calidad, cerrada en la fase 18. Un enlace intra-doc roto
      # no cambia el comportamiento, y por eso llevaba meses sin puerta: la
      # documentacion de este taller es donde vive el argumento, y un enlace
      # que no lleva a ningun sitio es un argumento que nadie puede seguir.
      #
      # Entra sola en scripts/gate.ps1, que lee este archivo en vez de llevar su
      # propia lista.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # ADR-0040, and the one step that fails on every commit before phase 11.
      #
      # Two **separate processes** open the same identity file through
      # `qyro_session` -- the path the application takes -- and the second is
      # handed the first's fingerprint to compare. Two calls inside one process
      # share a `OnceLock` and prove nothing; the defect was that the second
      # *process* minted a new key.
      #
      # Not the same as the `windows-crypto` step that already existed: that one
      # drives `qyro_win_dpapi` directly, so it proved DPAPI round-trips and
      # never touched the engine. That is exactly how the product shipped for
      # five phases with no identity at all while the evidence looked green.
      - name: An identity survives a process, through the engine
        shell: bash
        run: |
          set -euo pipefail
          store="$(mktemp -d)/identity.qyro"
          smoke=target/debug/qyro_store_smoke
          cargo build --locked --package qyro_store_smoke
          first="$($smoke session-open "$store")"
          echo "process 1: $first"
          second="$($smoke session-open "$store" "$first")"
          echo "process 2: $second"
          # And the control, so a step that compares a value with itself cannot
          # pass: a different store must give a different identity, and the
          # comparison must notice.
          other="$(mktemp -d)/identity.qyro"
          different="$($smoke session-open "$other")"
          test "$different" != "$first"
          if $smoke session-open "$other" "$first"; then
            echo "[FAIL] the comparison did not notice a different identity" >&2
            exit 1
          fi
          echo "[PASS] one identity per store, across processes, through qyro_session"
      # qyro_fs has one opt-in feature for the privileged Windows reparse-point
      # fixture. This line covers its Unix build; the matrix job below executes
      # the Windows side on a runner that can create the link.
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # Mandatory from sprint 2 on. Sprint 4A added the Ed25519 stack, so this
      # now guards real third-party code on a security-critical path; every
      # crate and licence is recorded in docs/LICENSE_AUDIT.md.
      - name: Audit dependencies for security advisories
        run: cargo audit --deny warnings
      # rust/fuzz is a separate workspace (libfuzzer-sys needs nightly), so it is
      # not covered by cargo fmt --all above.
      - name: Check fuzz target formatting
        run: rustfmt --check --edition 2024 rust/fuzz/fuzz_targets/*.rs

  rust-windows:
    # QYR-0078: seven consecutive runs hung for hours because no job
    # declared a cap, so a stuck step ran to GitHub's six-hour default
    # instead of failing with a log somebody could read.
    timeout-minutes: 45
    name: rust workspace (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      # The workspace has Windows-only production and eight cfg(windows) DPAPI
      # tests; its ninth guard test runs everywhere. Linux cannot cover that
      # production surface, which is how QYR-0105 survived until 5C.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fs-final-component:
    # QYR-0078: seven consecutive runs hung for hours because no job
    # declared a cap, so a stuck step ran to GitHub's six-hour default
    # instead of failing with a log somebody could read.
    timeout-minutes: 20
    name: fs final-component guard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            feature_args: ''
          - os: macos-latest
            feature_args: ''
          - os: windows-latest
            feature_args: '--features windows-reparse-test'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refuse a final-component link without touching its target
        run: >-
          cargo test -p qyro_fs ${{ matrix.feature_args }}
          tests::a_symlink_at_the_final_part_component_is_refused_without_touching_its_target
          -- --exact
      - name: Reject an opened part outside the destination root
        run: >-
          cargo test -p qyro_fs ${{ matrix.feature_args }}
          tests::an_opened_part_outside_the_root_is_rejected_before_it_can_be_changed
          -- --exact

  flutter:
    # QYR-0078: seven consecutive runs hung for hours because no job
    # declared a cap, so a stuck step ran to GitHub's six-hour default
    # instead of failing with a log somebody could read.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qyro
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # Release, not debug. The transfer test moves 8 MiB through ChaCha20 and
      # SHA-256, and a debug build of that stack turns a one-second test into a
      # multi-minute one. The receiver is built here too: qyro_net_smoke already
      # speaks the same engine and the same handshake, and it announces its port
      # before it accepts, so the test never has to guess.
      - name: Build qyro_ffi and the smoke receiver for the Dart transfer test
        working-directory: .
        run: cargo build --release --package qyro_ffi --package qyro_net_smoke
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify generated branding
        working-directory: .
        run: dart tools/branding_generator/bin/generate.dart --check
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- .
            exit 1
          fi
      - run: flutter analyze
      - name: Run Flutter, native ABI and Dart-driven transfer tests
        run: flutter test
        env:
          QYRO_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/release/libqyro_ffi.so
          QYRO_NET_SMOKE_PATH: ${{ github.workspace }}/target/release/qyro_net_smoke

  scripts:
    # QYR-0078: seven consecutive runs hung for hours because no job
    # declared a cap, so a stuck step ran to GitHub's six-hour default
    # instead of failing with a log somebody could read.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Verify Bash and PowerShell script contracts
        shell: bash
        run: |
          status=0
          bash scripts/tests/doctor_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/doctor_contract_test.ps1 || status=1
          bash scripts/tests/bootstrap_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/bootstrap_contract_test.ps1 || status=1
          bash scripts/tests/test_all_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/test_all_contract_test.ps1 || status=1
          bash scripts/tests/docs_consistency_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/docs_consistency_contract_test.ps1 || status=1
          # ADR-0049 §4: que la comprobacion de imports de win7 sepa fallar.
          pwsh -NoProfile -File scripts/tests/win7_imports_contract_test.ps1 || status=1
          pwsh -NoProfile -File scripts/tests/windows_package_contract_test.ps1 || status=1
          bash scripts/tests/launch_surface_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/launch_surface_contract_test.ps1 || status=1
          bash scripts/tests/repo_portability_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/repo_portability_contract_test.ps1 || status=1
          bash scripts/tests/crypto_platform_evidence_contract_test.sh || status=1
          pwsh -NoProfile -File scripts/tests/crypto_platform_evidence_contract_test.ps1 || status=1
          python3 -m unittest tools/logo_ascii_generator/test_logo_ascii_generator.py || status=1
          # Que el inspector de APK sepa fallar. Mide las tres cosas que deciden
          # si Qyro arranca en un telefono -- que ABIs lleva, la alineacion de
          # pagina de cada .so y su posicion dentro del zip -- y una comprobacion
          # que nunca ha estado roja no es una comprobacion. Los ELF de prueba se
          # fabrican en Python, asi que esto corre sin NDK.
          python3 -m unittest tools/apk_inspector/test_inspect_apk.py || status=1
          exit "$status"
