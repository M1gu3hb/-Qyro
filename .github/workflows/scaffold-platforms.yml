name: Scaffold Flutter platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Generate official host projects
        shell: bash
        run: |
          cd apps/qyro
          flutter create             --empty             --platforms=android,ios,windows             --org com.owner             --project-name qyro             .
          git restore -- pubspec.yaml analysis_options.yaml lib test assets
          rm -f test/widget_test.dart
      - name: Commit generated scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/qyro
          if git diff --cached --quiet; then
            echo "No scaffold changes were generated."
            exit 0
          fi
          git commit -m "chore: generate Flutter platform runners"
          git push
