name: CLI builds

# The portable binary, on the four targets phase 13 names.
#
# Windows 7 is **not** here: it needs nightly with `-Z build-std` for the Tier 3
# `*-win7-windows-*` targets, and that is phase 17. What this workflow does do is
# **measure the gap** — `verify_static.ps1 -ExpectWindows7` fails today by design
# (QYR-0360), so the day phase 17 lands there is already a check waiting to turn
# green rather than a claim to write.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "scripts/verify_static.ps1"
      - ".github/workflows/cli-builds.yml"

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      # `--target` explicitly, always: without it the rustflags also reach build
      # scripts, which are compiled for the host and break (R8 §6).
      - run: cargo build --locked --release -p qyro_cli --target ${{ matrix.target }}
      - name: The binary needs no C runtime, and we look rather than assume
        shell: pwsh
        run: |
          ./scripts/verify_static.ps1 -Binary "target/${{ matrix.target }}/release/qyro.exe"
      - name: Size, and say the number
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/qyro.exe"
          $kb = [math]::Round((Get-Item $exe).Length / 1KB)
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Write-Host "${{ matrix.target }}  $kb KB  $hash"
          # R8 §6 expects 750-950 KB for a binary carrying QR and serial. This
          # one carries neither yet, so a smaller number is correct; a much
          # larger one means a dependency arrived that nobody chose.
          if ($kb -gt 1500) {
            Write-Error "[BLOCKER] $kb KB. R8 §6 puts the ceiling around 950 KB for a fuller binary; something was pulled in."
            exit 1
          }
          "### ${{ matrix.target }}`n`n$kb KB`n`n$hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/qyro.exe
          if-no-files-found: error
          retention-days: 30

  linux-musl:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, i686-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release -p qyro_cli --target ${{ matrix.target }}
      - name: It is really static, checked and not assumed
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/qyro"
          file "$exe"
          # `ldd` on a static binary says so; on a dynamic one it lists the
          # interpreter. Both outcomes are asserted rather than eyeballed.
          if ldd "$exe" 2>&1 | grep -qiE 'not a dynamic executable|statically linked'; then
            echo "[PASS] $exe is static"
          else
            echo "[BLOCKER] $exe is dynamically linked:" >&2
            ldd "$exe" >&2
            exit 1
          fi
          echo "$(du -k "$exe" | cut -f1) KB  $(sha256sum "$exe" | cut -d' ' -f1)"
      # **The evidence phase 13 asks for, and its class stated precisely.**
      #
      # A container with no libc at all -- `scratch` has literally nothing --
      # cannot run a binary that needs one. Running there proves the binary
      # carries everything it needs.
      #
      # It is **not** a physical machine, and this step does not pretend it is:
      # what it shows is "no libc required", which is the property. Whether an
      # actual Pentium 4 from 2006 runs it is the hardware protocol, and that is
      # still blank.
      - name: It runs where there is no libc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/qyro /tmp/qyro
          printf 'FROM scratch\nCOPY qyro /qyro\nENTRYPOINT ["/qyro"]\n' > /tmp/Dockerfile
          docker build -t qyro-scratch -f /tmp/Dockerfile /tmp
          # `help` rather than the menu: a scratch container has no TTY, and the
          # binary is supposed to refuse a menu there -- which the next step
          # checks on purpose.
          docker run --rm qyro-scratch help | tee /tmp/out.txt
          grep -q 'no cloud, no accounts' /tmp/out.txt
          echo '[PASS] the binary ran in a container with no libc, no shell and no files'
      - name: And it refuses a menu where nobody can answer one
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm qyro-scratch < /dev/null; then
            echo '[BLOCKER] it opened a menu with no terminal attached' >&2
            exit 1
          fi
          echo '[PASS] refused, as ADR-0042 §3 requires'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/qyro
          if-no-files-found: error
          retention-days: 30
