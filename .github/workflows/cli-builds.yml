name: CLI builds

# The portable binary, on the four targets phase 13 names.
#
# Windows 7 is **not** here: it needs nightly with `-Z build-std` for the Tier 3
# `*-win7-windows-*` targets, and that is phase 17. What this workflow does do is
# **measure the gap** — `verify_static.ps1 -ExpectWindows7` fails today by design
# (QYR-0360), so the day phase 17 lands there is already a check waiting to turn
# green rather than a claim to write.

on:
  workflow_dispatch:
  push:
    # `claude/**` quitado el 2026-08-18: las 19 ramas de trabajo se
    # fusionaron en `main` y se borraron. Un patrón que no puede coincidir con
    # nada es una promesa de cobertura que ya no cubre.
    branches: [main]
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "scripts/verify_static.ps1"
      - ".github/workflows/cli-builds.yml"

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      # `--target` explicitly, always: without it the rustflags also reach build
      # scripts, which are compiled for the host and break (R8 §6).
      - run: cargo build --locked --release -p qyro_cli --target ${{ matrix.target }}
      - name: The binary needs no C runtime, and we look rather than assume
        shell: pwsh
        run: |
          ./scripts/verify_static.ps1 -Binary "target/${{ matrix.target }}/release/qyro.exe"
      - name: Size, and say the number
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/qyro.exe"
          $kb = [math]::Round((Get-Item $exe).Length / 1KB)
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Write-Host "${{ matrix.target }}  $kb KB  $hash"
          # **El techo se movio a 2000 KB el 2026-09-03, y aqui esta por que**
          # (QYR-0399). El comentario anterior decia que este binario "no lleva
          # ni QR ni serie todavia, asi que un numero mas pequeno es correcto".
          # Dejo de ser verdad hace fases: hoy lleva las dos, y una tercera cosa
          # que R8 §6 no previo.
          #
          # Lo que hay dentro, preguntado al resolutor y no estimado
          # (`cargo tree -p qyro_cli --depth 1`): qrcode (dibuja), qyro_eye
          # (DECODIFICA -- `qyro qr` comprueba que su propio codigo se lee, y ese
          # es su llamante de produccion), qyro_fountain, qyro_serial +
          # serialport, y qyro_session con la pila de cifrado entera. 57 crates
          # externos, todos elegidos.
          #
          # Medido: 1649 KB en x86_64-msvc. El techo sigue existiendo para lo que
          # existia -- "llego una dependencia que nadie eligio" -- y 2000 KB deja
          # margen sin dejar de morder.
          if ($kb -gt 2000) {
            Write-Error "[BLOCKER] $kb KB, y el techo son 2000. Mira `cargo tree -p qyro_cli --depth 1`: si hay una dependencia que nadie eligio, esta ahi."
            exit 1
          }
          "### ${{ matrix.target }}`n`n$kb KB`n`n$hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      # **`BUILD-INFO.txt`, y dice en MAYUSCULAS que no esta firmado**
      # (fase 20 §3.1). Un artefacto sin procedencia obliga a quien lo recibe a
      # confiar en el nombre del archivo, y el nombre de un archivo no es una
      # prueba de nada.
      #
      # Y el "NO FIRMADO" va en mayusculas a proposito: es la unica linea de
      # este archivo que cambia lo que alguien deberia hacer al ejecutarlo.
      - name: BUILD-INFO.txt
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/qyro.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $bytes = (Get-Item $exe).Length
          @"
          Qyro CLI
          ========

          target      ${{ matrix.target }}
          commit      ${{ github.sha }}
          construido  $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC
          tamano      $bytes bytes
          sha256      $hash

          FIRMA: **NO FIRMADO**

          Este binario no lleva firma de codigo. Windows enseñara una
          advertencia al ejecutarlo si lo descargaste de internet.

          Si lo copias a un USB con formato FAT32 o exFAT y lo ejecutas desde
          ahi, la advertencia NO aparece: Windows marca lo que llega por
          internet en un flujo de NTFS, y esos formatos no tienen donde
          guardarlo.

          La decision de firmar o no esta en docs/release/DECISION-DE-FIRMA.md,
          con sus numeros. No la ha tomado nadie todavia.

          Comprueba este binario antes de usarlo:
            PowerShell:  (Get-FileHash qyro.exe -Algorithm SHA256).Hash
            Linux:       sha256sum qyro
          "@ | Out-File "target/${{ matrix.target }}/release/BUILD-INFO.txt" -Encoding utf8
          Get-Content "target/${{ matrix.target }}/release/BUILD-INFO.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/qyro.exe
            target/${{ matrix.target }}/release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

  linux-musl:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, i686-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release -p qyro_cli --target ${{ matrix.target }}
      - name: It is really static, checked and not assumed
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/qyro"
          file "$exe"
          # `ldd` on a static binary says so; on a dynamic one it lists the
          # interpreter. Both outcomes are asserted rather than eyeballed.
          #
          # **La salida se captura antes de mirarla, y no es cosmetica**
          # (QYR-0399). `ldd` sale con codigo distinto de cero sobre un binario
          # estatico en algunas plataformas -- i686 musl entre ellas -- y con
          # `set -o pipefail` arriba, eso convertia una tuberia cuyo `grep` SI
          # encontraba "not a dynamic executable" en un estado de fallo. El
          # guardian fallaba EXACTAMENTE cuando el binario estaba bien, e
          # imprimia como prueba de culpabilidad la frase que lo absolvia.
          report="$(ldd "$exe" 2>&1 || true)"
          if grep -qiE 'not a dynamic executable|statically linked' <<<"$report"; then
            echo "[PASS] $exe is static"
          else
            echo "[BLOCKER] $exe is dynamically linked:" >&2
            echo "$report" >&2
            exit 1
          fi
          echo "$(du -k "$exe" | cut -f1) KB  $(sha256sum "$exe" | cut -d' ' -f1)"
      # **The evidence phase 13 asks for, and its class stated precisely.**
      #
      # A container with no libc at all -- `scratch` has literally nothing --
      # cannot run a binary that needs one. Running there proves the binary
      # carries everything it needs.
      #
      # It is **not** a physical machine, and this step does not pretend it is:
      # what it shows is "no libc required", which is the property. Whether an
      # actual Pentium 4 from 2006 runs it is the hardware protocol, and that is
      # still blank.
      - name: It runs where there is no libc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/qyro /tmp/qyro
          printf 'FROM scratch\nCOPY qyro /qyro\nENTRYPOINT ["/qyro"]\n' > /tmp/Dockerfile
          docker build -t qyro-scratch -f /tmp/Dockerfile /tmp
          # `help` rather than the menu: a scratch container has no TTY, and the
          # binary is supposed to refuse a menu there -- which the next step
          # checks on purpose.
          docker run --rm qyro-scratch help | tee /tmp/out.txt
          grep -q 'no cloud, no accounts' /tmp/out.txt
          echo '[PASS] the binary ran in a container with no libc, no shell and no files'
      - name: And it refuses a menu where nobody can answer one
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm qyro-scratch < /dev/null; then
            echo '[BLOCKER] it opened a menu with no terminal attached' >&2
            exit 1
          fi
          echo '[PASS] refused, as ADR-0042 §3 requires'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qyro-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/qyro
          if-no-files-found: error
          retention-days: 30
