name: Android runtime ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-runtime.yml"
      - "apps/qyro/**"
      - "rust/crates/qyro_ffi/**"
      # `qyro_ffi` depends on `qyro_core`, so a change there changes the
      # library this workflow loads. It was not listed, which meant the ABI
      # check would not run for the one crate that can actually alter what
      # Dart links (QYR-0045).
      - "rust/crates/qyro_core/**"
      - "Cargo.*"
  push:
    # Any working branch, by pattern. Naming one is what QYR-0040 was:
    # sprint 4C.2 wrote the then-current branch into six files, which made "CI
    # runs on the working branch" true of that branch and false of the next one.
    # A pattern is a property of the repository; a name is a reminder, and the
    # reminder was not enough.
    #
    # `claude/**` and not `**`: covering every branch in the repository spends
    # runner minutes on work this project did not start.
    #
    # Push rather than a pull request, deliberately. A `pull_request` run
    # executes against a merge commit that exists only inside the Actions run,
    # so its run ID cannot be cited as evidence for a commit in this branch. A
    # push run executes on exactly the commit that was pushed, which is the
    # thing STATUS.md has to name.
    # `claude/**` quitado el 2026-08-18: las 19 ramas de trabajo se
    # fusionaron en `main` y se borraron. Un patrón que no puede coincidir con
    # nada es una promesa de cobertura que ya no cubre.
    branches: [main]
    paths:
      - ".github/workflows/android-runtime.yml"
      - "apps/qyro/**"
      - "rust/crates/qyro_ffi/**"
      # `qyro_ffi` depends on `qyro_core`, so a change there changes the
      # library this workflow loads. It was not listed, which meant the ABI
      # check would not run for the one crate that can actually alter what
      # Dart links (QYR-0045).
      - "rust/crates/qyro_core/**"
      - "Cargo.*"

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Enable KVM access for the hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and package qyro_ffi for the emulator
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-linux-android
          qyro_ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          test -n "$qyro_ndk"
          qyro_toolchain="$qyro_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$qyro_toolchain/x86_64-linux-android21-clang"
          cargo build --locked --package qyro_ffi --target x86_64-linux-android
          qyro_library="target/x86_64-linux-android/debug/libqyro_ffi.so"
          "$qyro_toolchain/llvm-nm" -g --defined-only "$qyro_library" | grep -q ' qyro_protocol_version_ptr$'
          "$qyro_toolchain/llvm-nm" -g --defined-only "$qyro_library" | grep -q ' qyro_protocol_version_len$'
          install -D "$qyro_library" apps/qyro/android/app/src/main/jniLibs/x86_64/libqyro_ffi.so
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: apps/qyro
        run: flutter pub get --enforce-lockfile
      - name: Execute native ABI smoke test in an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics -camera-back none
          script: cd apps/qyro && flutter test integration_test/native_abi_smoke_test.dart -d emulator-5554
