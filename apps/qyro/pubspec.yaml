name: qyro
description: Cross-platform interface baseline for Qyro.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # The Windows dialog of ADR-0034, amendment 1. flutter.dev, BSD-3.
  #
  # The endorsed Windows implementation, not the `file_selector` umbrella. The
  # umbrella resolves seven more packages and one of them is
  # `file_selector_android`, which is the implementation that copies the whole
  # file into the app cache before Dart sees it (QYR-0323). Android goes through
  # android/app/src/main/kotlin/com/owner/qyro/FilePickerChannel.kt instead, and
  # not depending on the copier is stronger than remembering not to call it.
  file_selector_windows: 0.9.3+5

dev_dependencies:
  branding_generator:
    path: ../../tools/branding_generator
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/qyro-logo.png
    - assets/generated/logo_ascii.json
